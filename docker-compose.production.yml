services:
  mysql:
    image: mysql:8.4
    container_name: classroom-monitoring-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env.production 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?请在 deploy/.env.production 设置 MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?请在 deploy/.env.production 设置 MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env.production 设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/001_init_mysql.sql:/docker-entrypoint-initdb.d/001_init_mysql.sql:ro
      - ./db/002_teaching_analysis.sql:/docker-entrypoint-initdb.d/002_teaching_analysis.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: classroom-monitoring-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?请在 deploy/.env.production 设置 MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?请在 deploy/.env.production 设置 MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env.production 设置 MYSQL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请在 deploy/.env.production 设置 JWT_SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 deploy/.env.production 设置 ADMIN_PASSWORD}
      AUTO_CREATE_TABLES: "false"
      ALIYUN_API_KEY: ${ALIYUN_API_KEY:-}
      TZ: Asia/Shanghai
    volumes:
      - ${INPUTS_DIR:-./inputs}:/app/inputs:ro
      - ${MODELS_DIR:-./models}:/app/models:ro
      - ${OUTPUTS_DIR:-./outputs}:/app/outputs

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: classroom-monitoring-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  mysql_data:
