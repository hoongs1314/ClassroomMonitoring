<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52616b"/>
    </marker>
    <style>
      .title { font-family: 'Microsoft YaHei','SimHei',sans-serif; font-size: 32px; font-weight: 700; fill: #1f2933; }
      .subtitle { font-family: 'Microsoft YaHei','SimHei',sans-serif; font-size: 17px; fill: #52616b; }
      .area { font-family: 'Microsoft YaHei','SimHei',sans-serif; font-size: 23px; font-weight: 700; fill: #24313a; }
      .box-title { font-family: 'Microsoft YaHei','SimHei',sans-serif; font-size: 18px; font-weight: 700; fill: #24313a; }
      .box-text { font-family: 'Microsoft YaHei','SimHei',sans-serif; font-size: 15px; fill: #425466; }
      .note { font-family: 'Microsoft YaHei','SimHei',sans-serif; font-size: 14px; fill: #5f6c72; }
      .line { stroke: #52616b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #6f8791; stroke-width: 2.2; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .small { font-family: 'Microsoft YaHei','SimHei',sans-serif; font-size: 13px; fill: #61747e; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#ffffff"/>
  <text x="800" y="56" text-anchor="middle" class="title">课堂异常行为智能检测项目全景图</text>
  <text x="800" y="84" text-anchor="middle" class="subtitle">从数据准备、模型推理到教学复盘的项目组成与信息流</text>

  <rect x="55" y="130" width="430" height="790" rx="18" fill="#f7fafb" stroke="#8ca3ad" stroke-width="2.2"/>
  <text x="270" y="174" text-anchor="middle" class="area">数据与模型准备</text>
  <line x1="90" y1="194" x2="450" y2="194" stroke="#b9c8ce" stroke-width="1.5"/>
  <rect x="100" y="235" width="340" height="128" rx="13" fill="#e8f0f3" stroke="#9aafb8" stroke-width="1.7"/>
  <text x="270" y="275" text-anchor="middle" class="box-title">课堂视频与样本帧</text>
  <text x="270" y="306" text-anchor="middle" class="box-text">项目本地测试视频</text>
  <text x="270" y="332" text-anchor="middle" class="box-text">后续补充的课堂样本</text>

  <rect x="100" y="425" width="340" height="142" rx="13" fill="#fdfcf8" stroke="#b6a36b" stroke-width="1.7" stroke-dasharray="7 5"/>
  <text x="270" y="463" text-anchor="middle" class="box-title">行为标注与数据划分</text>
  <text x="270" y="494" text-anchor="middle" class="box-text">NORMAL、HEAD_DOWN、DESK_LYING</text>
  <text x="270" y="520" text-anchor="middle" class="box-text">TURNING_HEAD、EATING</text>
  <text x="270" y="551" text-anchor="middle" class="small">样本数量、划分与标注证据由实际材料补充</text>

  <rect x="100" y="629" width="340" height="142" rx="13" fill="#fdfcf8" stroke="#b6a36b" stroke-width="1.7" stroke-dasharray="7 5"/>
  <text x="270" y="668" text-anchor="middle" class="box-title">YOLO 训练与离线评估</text>
  <text x="270" y="699" text-anchor="middle" class="box-text">训练日志、曲线与混淆矩阵</text>
  <text x="270" y="725" text-anchor="middle" class="box-text">由独立训练环境据实补充</text>
  <text x="270" y="755" text-anchor="middle" class="small">实际指标不在本图中预设</text>

  <rect x="100" y="823" width="340" height="58" rx="12" fill="#e8f0f3" stroke="#9aafb8" stroke-width="1.7"/>
  <text x="270" y="859" text-anchor="middle" class="box-title">行为检测权重文件（.pt）</text>

  <rect x="585" y="130" width="430" height="790" rx="18" fill="#f7fafb" stroke="#66818d" stroke-width="2.4"/>
  <text x="800" y="174" text-anchor="middle" class="area">系统运行与智能分析</text>
  <line x1="620" y1="194" x2="980" y2="194" stroke="#b9c8ce" stroke-width="1.5"/>
  <rect x="640" y="236" width="320" height="108" rx="13" fill="#e8f0f3" stroke="#9aafb8" stroke-width="1.7"/>
  <text x="800" y="275" text-anchor="middle" class="box-title">教师端与管理端</text>
  <text x="800" y="305" text-anchor="middle" class="box-text">登录、班级选择、监控、查询与复盘</text>

  <rect x="640" y="400" width="320" height="108" rx="13" fill="#e8f0f3" stroke="#9aafb8" stroke-width="1.7"/>
  <text x="800" y="440" text-anchor="middle" class="box-title">FastAPI 业务服务</text>
  <text x="800" y="470" text-anchor="middle" class="box-text">认证、授权、接口、视频流与状态推送</text>

  <rect x="640" y="564" width="320" height="178" rx="13" fill="#e8f0f3" stroke="#9aafb8" stroke-width="1.7"/>
  <text x="800" y="604" text-anchor="middle" class="box-title">监控分析服务</text>
  <text x="800" y="636" text-anchor="middle" class="box-text">视频读取 → YOLO / SAHI 检测</text>
  <text x="800" y="666" text-anchor="middle" class="box-text">座位关联 → 滑动窗口告警</text>
  <text x="800" y="696" text-anchor="middle" class="box-text">异常截图 → VLM 复核</text>
  <text x="800" y="723" text-anchor="middle" class="small">VLM 仅处理已达到告警条件的座位</text>

  <rect x="640" y="800" width="320" height="81" rx="13" fill="#e8f0f3" stroke="#9aafb8" stroke-width="1.7"/>
  <text x="800" y="834" text-anchor="middle" class="box-title">实时状态与事件输出</text>
  <text x="800" y="861" text-anchor="middle" class="box-text">座位状态、统计、截图与事件说明</text>

  <rect x="1115" y="130" width="430" height="790" rx="18" fill="#f7fafb" stroke="#8ca3ad" stroke-width="2.2"/>
  <text x="1330" y="174" text-anchor="middle" class="area">数据留痕与教学应用</text>
  <line x1="1150" y1="194" x2="1510" y2="194" stroke="#b9c8ce" stroke-width="1.5"/>
  <rect x="1160" y="235" width="340" height="128" rx="13" fill="#e8f0f3" stroke="#9aafb8" stroke-width="1.7"/>
  <text x="1330" y="275" text-anchor="middle" class="box-title">MySQL 业务数据</text>
  <text x="1330" y="306" text-anchor="middle" class="box-text">用户、班级、授权与监控会话</text>
  <text x="1330" y="332" text-anchor="middle" class="box-text">座位、事件、复核与复盘记录</text>

  <rect x="1160" y="425" width="340" height="128" rx="13" fill="#e8f0f3" stroke="#9aafb8" stroke-width="1.7"/>
  <text x="1330" y="465" text-anchor="middle" class="box-title">事件图像文件</text>
  <text x="1330" y="496" text-anchor="middle" class="box-text">异常座位局部截图</text>
  <text x="1330" y="522" text-anchor="middle" class="box-text">用于事件详情与人工复核</text>

  <rect x="1160" y="615" width="340" height="142" rx="13" fill="#e8f0f3" stroke="#9aafb8" stroke-width="1.7"/>
  <text x="1330" y="654" text-anchor="middle" class="box-title">课堂期间辅助查看</text>
  <text x="1330" y="685" text-anchor="middle" class="box-text">视频画面、检测框、座位状态</text>
  <text x="1330" y="711" text-anchor="middle" class="box-text">提示与警告事件</text>

  <rect x="1160" y="813" width="340" height="68" rx="13" fill="#e8f0f3" stroke="#9aafb8" stroke-width="1.7"/>
  <text x="1330" y="854" text-anchor="middle" class="box-title">课后查询、人工确认与教学复盘</text>

  <path d="M270 363 V425" class="line"/>
  <path d="M270 567 V629" class="line"/>
  <path d="M270 771 V823" class="line"/>
  <path d="M440 852 H540 V652 H640" class="line"/>
  <text x="503" y="634" text-anchor="middle" class="small">部署权重</text>
  <path d="M800 344 V400" class="line"/>
  <path d="M800 508 V564" class="line"/>
  <path d="M800 742 V800" class="line"/>
  <path d="M960 840 H1065 V299 H1160" class="line"/>
  <path d="M960 840 H1065 V489 H1160" class="line"/>
  <path d="M1330 363 V615" class="dashed"/>
  <path d="M1330 553 V615" class="dashed"/>
  <path d="M1330 757 V813" class="line"/>
  <path d="M800 236 V212 H1330 V235" class="dashed"/>
  <text x="1065" y="208" text-anchor="middle" class="small">经授权访问与结果展示</text>

  <text x="800" y="989" text-anchor="middle" class="note">虚线框表示需由实际标注、训练日志和评估图补充的实验材料；其余模块均对应当前项目代码或数据表结构。</text>
</svg>
