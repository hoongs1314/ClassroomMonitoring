  <rect x="1160" y="668" width="340" height="116" rx="14" fill="#e8f0f3" stroke="#8ca3ad" stroke-width="1.8"/>
  <text x="1330" y="710" text-anchor="middle" class="head">教学反馈材料</text>
  <text x="1330" y="745" text-anchor="middle" class="txt">人工观察、改进计划与验证记录</text>

  <path d="M270 368 V432" class="dash"/><path d="M270 604 V668" class="dash"/><path d="M440 726 H630" class="line"/>
  <path d="M970 304 H1160" class="line"/><path d="M970 518 H1160" class="line"/><path d="M800 368 V432" class="line"/><path d="M800 604 V668" class="line"/><path d="M1330 368 V432" class="line"/><path d="M1330 604 V668" class="line"/>
  <text x="800" y="976" text-anchor="middle" class="note">说明：项目已实现教学配置、课程权限、课次档案与课程复盘的数据和接口主链路；模型指标、真实录像处理和长期运行须以独立实验或集成测试补充。</text>
