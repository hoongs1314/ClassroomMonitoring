  <text x="270" y="535" text-anchor="middle" class="txt">TURNING_HEAD、EATING</text>
  <text x="270" y="570" text-anchor="middle" class="note">模型指标必须以独立实验记录为准</text>
  <rect x="100" y="668" width="340" height="116" rx="14" fill="#e8f0f3" stroke="#8ca3ad" stroke-width="1.8"/>
