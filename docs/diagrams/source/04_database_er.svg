  <rect x="1257" y="452" width="258" height="156" rx="10" class="card"/><rect x="1257" y="452" width="258" height="36" rx="10" class="bar"/>
  <text x="1386" y="476" text-anchor="middle" class="table">report / action</text><text x="1277" y="516" class="field">teaching_analysis_report</text><text x="1277" y="545" class="field">teaching_improvement_action</text><text x="1277" y="574" class="field">结论、措施与验证记录</text>

  <path d="M342 260 H458" class="line"/><text x="398" y="247" text-anchor="middle" class="label">绑定</text>
  <path d="M615 326 V382" class="line"/><text x="638" y="360" class="label">包含</text>
  <path d="M772 468 H886" class="line"/><text x="829" y="455" text-anchor="middle" class="label">生成课次</text>
  <path d="M1015 346 V438" class="line"/><text x="1038" y="400" class="label">产生</text>
  <path d="M1144 532 H1257" class="line"/><text x="1200" y="519" text-anchor="middle" class="label">归集</text>
  <path d="M1386 352 V452" class="line"/><text x="1408" y="410" class="label">形成</text>
  <path d="M772 690 H850 V300 H886" class="line"/><text x="812" y="676" text-anchor="middle" class="label">设备快照</text>
  <text x="800" y="976" text-anchor="middle" class="note">说明：图中为论文说明所需的核心实体分组和关系，完整字段、基数与一致性约束见 docs/database_er.md。</text>
