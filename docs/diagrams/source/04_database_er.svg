  <rect x="886" y="438" width="258" height="188" rx="10" class="card"/><rect x="886" y="438" width="258" height="36" rx="10" class="bar"/>
  <text x="1015" y="462" text-anchor="middle" class="table">行为与分析证据</text><text x="906" y="502" class="field">monitor_session_seat</text><text x="906" y="531" class="field">monitor_behavior_event</text><text x="906" y="560" class="field">monitor_event_frame / vlm_review</text><text x="906" y="589" class="field">lesson_summary / behavior_stat</text>

  <rect x="1220" y="120" width="332" height="798" rx="18" fill="#f8fafb" stroke="#8ca3ad" stroke-width="2"/>
  <text x="1250" y="158" class="group">课程复盘与改进闭环</text>
  <rect x="1257" y="196" width="258" height="156" rx="10" class="card"/><rect x="1257" y="196" width="258" height="36" rx="10" class="bar"/>
