<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#5e7681"/></marker>
    <style>
      .title{font-family:'Microsoft YaHei','SimHei',sans-serif;font-size:32px;font-weight:700;fill:#1f2933}.sub{font-family:'Microsoft YaHei','SimHei',sans-serif;font-size:17px;fill:#52616b}.group{font-family:'Microsoft YaHei','SimHei',sans-serif;font-size:22px;font-weight:700;fill:#24313a}.table{font-family:'Consolas','Microsoft YaHei',sans-serif;font-size:17px;font-weight:700;fill:#fff}.field{font-family:'Microsoft YaHei','SimHei',sans-serif;font-size:15px;fill:#425466}.note{font-family:'Microsoft YaHei','SimHei',sans-serif;font-size:14px;fill:#5f6c72}.card{fill:#fff;stroke:#7f99a5;stroke-width:1.8}.bar{fill:#607d8b}.line{stroke:#5e7681;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.label{font-family:'Microsoft YaHei','SimHei',sans-serif;font-size:15px;font-weight:700;fill:#4c6570}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#fff"/>
  <text x="800" y="56" text-anchor="middle" class="title">课后教学分析核心实体关系图</text>
  <text x="800" y="84" text-anchor="middle" class="sub">以教学课程为权限边界，以课次、事件证据和课程报告为复盘数据链路</text>

  <rect x="48" y="120" width="330" height="798" rx="18" fill="#f8fafb" stroke="#8ca3ad" stroke-width="2"/>
  <text x="78" y="158" class="group">账号与权限</text>
  <rect x="84" y="196" width="258" height="128" rx="10" class="card"/><rect x="84" y="196" width="258" height="36" rx="10" class="bar"/>
  <text x="213" y="220" text-anchor="middle" class="table">sys_user / sys_role</text><text x="104" y="260" class="field">账号、角色与令牌</text><text x="104" y="289" class="field">管理员或教师身份</text>
  <rect x="84" y="420" width="258" height="142" rx="10" class="card"/><rect x="84" y="420" width="258" height="36" rx="10" class="bar"/>
  <text x="213" y="444" text-anchor="middle" class="table">edu_teacher</text><text x="104" y="484" class="field">教师档案与 user_id</text><text x="104" y="513" class="field">班级级授权 edu_teacher_class</text>

  <rect x="420" y="120" width="390" height="798" rx="18" fill="#f8fafb" stroke="#8ca3ad" stroke-width="2"/>
  <text x="450" y="158" class="group">教学主数据与固定课表</text>
  <rect x="458" y="196" width="314" height="130" rx="10" class="card"/><rect x="458" y="196" width="314" height="36" rx="10" class="bar"/>
  <text x="615" y="220" text-anchor="middle" class="table">edu_academic_year / term</text><text x="478" y="260" class="field">学年、学期与有效日期</text><text x="478" y="289" class="field">课程匹配的时间范围</text>
  <rect x="458" y="382" width="314" height="172" rx="10" class="card"/><rect x="458" y="382" width="314" height="36" rx="10" class="bar"/>
  <text x="615" y="406" text-anchor="middle" class="table">teaching_course</text><text x="478" y="446" class="field">班级、学期、科目、任课教师</text><text x="478" y="475" class="field">课程分析与报告的权限边界</text><text x="478" y="504" class="field">edu_lesson_schedule：星期与课时</text>
  <rect x="458" y="626" width="314" height="130" rx="10" class="card"/><rect x="458" y="626" width="314" height="36" rx="10" class="bar"/>
  <text x="615" y="650" text-anchor="middle" class="table">camera_class_binding</text><text x="478" y="690" class="field">camera_device 与 class_id</text><text x="478" y="719" class="field">录像来源的有效期绑定</text>

  <rect x="850" y="120" width="330" height="798" rx="18" fill="#f8fafb" stroke="#8ca3ad" stroke-width="2"/>
